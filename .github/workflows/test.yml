name: Test
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install existing helper dependencies
        shell: pwsh
        run: |
          Install-Module Add-PrefixForLogging -RequiredVersion 1.0.0.2 -Scope CurrentUser -Force -Repository PSGallery
          Install-Module Clear-Files -RequiredVersion 1.0.0.0 -Scope CurrentUser -Force -Repository PSGallery
          Install-Module Send-FileViaEmail -RequiredVersion 2.0.0.0 -Scope CurrentUser -Force -Repository PSGallery
          Install-Module ImportExcel -RequiredVersion 7.8.10 -Scope CurrentUser -Force -Repository PSGallery
      - name: Offline acceptance
        shell: pwsh
        run: ./tests/acceptance.ps1
      - name: Capability brief and package
        shell: pwsh
        run: |
          ./tests/capabilities.ps1
          ./tests/capabilities-negative.ps1
          ./tests/package.ps1
