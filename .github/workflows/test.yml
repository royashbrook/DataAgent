name: Test
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Offline acceptance
        shell: pwsh
        run: ./tests/acceptance.ps1
