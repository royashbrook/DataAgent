name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate and publish
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @('./DataAgent', './testing/DataAgent.Test')
          $env:PSModulePath = (@($PWD.Path, "$PWD/testing", $env:PSModulePath) -join [IO.Path]::PathSeparator)
          foreach ($path in $packages) {
            $name = Split-Path $path -Leaf
            $data = Test-ModuleManifest "$path/$name.psd1"
            if ($env:RELEASE_TAG -cne "v$($data.Version)") { throw "Release tag must match $name version." }
          }
          if (!$env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY is required.' }
          foreach ($path in $packages) {
            Publish-Module -Path $path -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY
          }
