name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate and publish
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Import-PowerShellDataFile ./DataAgent/DataAgent.psd1
          if ($env:RELEASE_TAG -cne "v$($data.ModuleVersion)") { throw 'Release tag must match the module version.' }
          foreach ($dependency in $data.RequiredModules) {
            Install-Module $dependency.ModuleName -RequiredVersion $dependency.RequiredVersion -Scope CurrentUser -Force -Repository PSGallery
          }
          $null = Test-ModuleManifest ./DataAgent/DataAgent.psd1
          if (!$env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY is required.' }
          Publish-Module -Path ./DataAgent -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY
